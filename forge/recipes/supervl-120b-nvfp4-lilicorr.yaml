id: supervl-120b-nvfp4-lilicorr
title: NVIDIA Nemotron 3.5 Super VL 120B-A12B NVFP4 + LiLiCorr drafter
model: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
revision: main
drafter: {model: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr, note: "speculative_config.method dflash, num_speculative_tokens 7. Card: \"intended for DGX Spark (GB10) only\"."}
engine: vllm
weights_gb: 76.33
vllm:
  min_version: "0.32.0"
  image: vllm/vllm-openai:v0.32.0
  run_image: vllm/vllm-openai:nightly-3f1bcfd82bb2e93fcd364fc7a5491718453a77e2   # image the fleet runs (satisfies min_version; same build as the rig venv)
  env: {}
  extra_files: []
serve:
  args: ["--served-model-name", "nemotron-3.5-super-vl", "--max-num-seqs", "1", "--trust-remote-code", "--gpu-memory-utilization", "0.75", "--max-num-batched-tokens", "8192", "--speculative_config.model", "nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr", "--speculative_config.num_speculative_tokens", "7", "--speculative_config.method", "dflash", "--mamba-backend", "flashinfer", "--mamba-ssm-cache-dtype", "float16", "--enable-mamba-cache-stochastic-rounding", "--mamba-cache-philox-rounds", "5", "--enable-mamba-shared-prefix-checkpoint", "--video-pruning-rate", "0.5", "--media-io-kwargs", "{\"video\": {\"fps\": 2, \"num_frames\": 256}}", "--block-size", "64", "--prefix-match-unit", "64", "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder", "--reasoning-parser", "nemotron_v3"]
  source: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4#quick-start
  quoted: |
    export MODEL=nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    export DRAFT_MODEL=nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr
    vllm serve $MODEL \
      --served-model-name nemotron-3.5-super-vl \
      --max-num-seqs 1 \
      --trust-remote-code \
      --gpu-memory-utilization 0.75 \
      --max-num-batched-tokens 8192 \
      --speculative_config.model $DRAFT_MODEL\
      --speculative_config.num_speculative_tokens 7 \<TAB>
      --speculative_config.method dflash \
      --mamba-backend flashinfer \
      --mamba-ssm-cache-dtype float16 \
      --enable-mamba-cache-stochastic-rounding \
      --mamba-cache-philox-rounds 5 \
      --enable-mamba-shared-prefix-checkpoint \
      --video-pruning-rate 0.5 \
      --media-io-kwargs '{"video": {"fps": 2, "num_frames": 256}}' \
      --block-size 64 \
      --prefix-match-unit 64 \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_coder \
      --reasoning-parser nemotron_v3
  notes: "Card: \"This vLLM configuration is intended for DGX Spark (GB10) only. It serves the model with one concurrent sequence and seven speculative tokens per draft using LiLiCorr.\" Image: vllm/vllm-openai:nightly-3f1bcfd82bb2e93fcd364fc7a5491718453a77e2 or vllm/vllm-openai:v0.32.0. $MODEL/$DRAFT_MODEL substituted from the card's export lines. Published text has a TAB after the backslash on the num_speculative_tokens line (shown as <TAB> in quoted), which ends the command there if pasted into bash as-is; args here are the full intended list. Reasoning levels off / on (medium) / on via enable_thinking and medium_effort."
chat:
  system_prompt: null
  chat_template_kwargs: {enable_thinking: false}
hardware:
  fits: [rtxpro6000_95g]
  adapt:                      # minimal change so the published command loads on this GPU class; applied to the baseline AND every candidate
    rtxpro6000_95g:
      set: {"--gpu-memory-utilization": "0.92"}
      why: "published 0.75 targets the 128 GB unified memory of DGX Spark; 0.75 x 95.6 GB cannot hold the 76 GB of weights. 0.92 is the vLLM default."
  tensor_parallel: 1
  notes: "Card lists DGX Spark as the target for this command. For RTX Pro 6000 the card points to llama.cpp / Unsloth (no vLLM command given). --gpu-memory-utilization 0.75 from the card; weights alone are ~76 GB (target 75.01 + drafter 1.32), and 0.75 x 95 GB = ~71 GB, so the published args cannot hold the weights on one 95 GB RTX PRO 6000; weights + 20% (~91.6 GB) would otherwise be under 95 GB."
variants:
  - {name: c1, concurrency: 1, max_tokens: 512, metric: decode_tok_s}

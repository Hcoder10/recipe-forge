id: nano3-30b-a3b-fp8
title: NVIDIA Nemotron 3 Nano 30B-A3B FP8
model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
revision: main
drafter: null
engine: vllm
weights_gb: 32.68
vllm:
  min_version: "0.12.0"
  image: vllm/vllm-openai:v0.12.0
  run_image: vllm/vllm-openai:nightly-3f1bcfd82bb2e93fcd364fc7a5491718453a77e2   # image the fleet runs (satisfies min_version; same build as the rig venv)
  env: {VLLM_USE_FLASHINFER_MOE_FP8: "1"}
  extra_files: [{url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8/resolve/main/nano_v3_reasoning_parser.py, dest: nano_v3_reasoning_parser.py}]
serve:
  args: ["--served-model-name", "model", "--max-num-seqs", "8", "--tensor-parallel-size", "1", "--max-model-len", "262144", "--trust-remote-code", "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder", "--reasoning-parser-plugin", "nano_v3_reasoning_parser.py", "--reasoning-parser", "nano_v3", "--kv-cache-dtype", "fp8"]
  source: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8#use-it-with-vllm
  quoted: |
    VLLM_USE_FLASHINFER_MOE_FP8=1 \
    vllm serve nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8 \
      --served-model-name model \
      --max-num-seqs 8 \
      --tensor-parallel-size 1 \
      --max-model-len 262144 \
      --port 8000 \
      --trust-remote-code \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_coder \
      --reasoning-parser-plugin nano_v3_reasoning_parser.py \
      --reasoning-parser nano_v3 \
      --kv-cache-dtype fp8
  notes: "Card: pip install -U \"vllm>=0.12.0\"; Jetson Thor / DGX Spark: NGC vllm container 25.12.post1-py3. Context 256k in this command; up to 1M with VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 and --max-model-len 1M. Image tag not named by the card (v0.12.0 is the nearest official tag meeting the minimum). Reasoning on by default; enable_thinking=False turns it off."
published:
  - metric: "relative_speedup"
    value: 3.3
    units: "x output tokens/s/GPU vs Qwen3-30B-A3B-Thinking-2507"
    gpu: "single H200"
    concurrency: null
    isl_osl: "8K/16K"
    engine: "best of vLLM and TRT-LLM (versions not stated)"
    precision: "FP8 weights and activations"
    source: "https://research.nvidia.com/labs/nemotron/files/NVIDIA-Nemotron-3-Nano-Technical-Report.pdf"
    quote: "Further, on 8K input / 16K output setting, Nemotron 3 Nano provides inference throughput that is 3.3× higher than Qwen3-30B-A3B-Thinking-2507 and 2.2× higher than GPT-OSS-20B. We measured throughput on a single H200 GPU with vLLM and TRT-LLM and used the best out of the two for each model. (Figure 1 caption) ... We used FP8 for both weights and activations for throughput measurement of Nemotron 3 Nano and Qwen3."
  - metric: "relative_speedup"
    value: 2.2
    units: "x output tokens/s/GPU vs GPT-OSS-20B"
    gpu: "single H200"
    concurrency: null
    isl_osl: "8K/16K"
    engine: "best of vLLM and TRT-LLM (versions not stated)"
    precision: "FP8 weights and activations (GPT-OSS-20B: mxfp4 weights, bfloat16 activations)"
    source: "https://research.nvidia.com/labs/nemotron/files/NVIDIA-Nemotron-3-Nano-Technical-Report.pdf"
    quote: "Further, on 8K input / 16K output setting, Nemotron 3 Nano provides inference throughput that is 3.3× higher than Qwen3-30B-A3B-Thinking-2507 and 2.2× higher than GPT-OSS-20B."
chat:
  system_prompt: null
  chat_template_kwargs: {enable_thinking: false}
hardware:
  fits: [rtxpro6000_95g]
  tensor_parallel: 1
  notes: "Card test hardware: NVIDIA B200 192GB, RTX PRO 6000 96GB, Jetson Thor, DGX Spark."
variants:
  - {name: c1, concurrency: 1, max_tokens: 512, metric: decode_tok_s}
  - {name: c8, concurrency: 8, max_tokens: 512, metric: output_tok_s}

id: lightning-30b-a3b-nvfp4
title: NVIDIA Nemotron 3.5 Lightning 30B-A3B NVFP4
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
revision: main
drafter: null
engine: vllm
weights_gb: 21.56
vllm:
  min_version: "0.27.1"
  image: vllm/vllm-openai:v0.27.1
  run_image: vllm/vllm-openai:nightly-3f1bcfd82bb2e93fcd364fc7a5491718453a77e2   # image the fleet runs (satisfies min_version; same build as the rig venv)
  env: {VLLM_HUMMING_MOE_GEMM_TYPE: "indexed"}
  extra_files: []
serve:
  args: ["--max-num-seqs", "256", "--max-num-batched-tokens", "16384", "--enable-prefix-caching", "--async-scheduling", "--mamba-backend", "flashinfer", "--moe-backend", "humming", "--linear-backend", "humming", "--mamba-ssu-algorithm", "horizontal", "--mamba-cache-mode", "align", "--mamba-ssm-cache-dtype", "float16", "--enable-mamba-cache-stochastic-rounding", "--mamba-cache-philox-rounds", "5", "--reasoning-parser", "nemotron_v3", "--tool-call-parser", "qwen3_coder", "--enable-auto-tool-choice"]
  source: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4#1x-h100-max-throughput
  quoted: |
    VLLM_HUMMING_MOE_GEMM_TYPE=indexed \
    vllm serve --model $MODEL_CKPT \
        --max-num-seqs 256 \
        --max-num-batched-tokens 16384 \
        --enable-prefix-caching \
        --async-scheduling \
        --mamba-backend flashinfer \
        --moe-backend humming \
        --linear-backend humming \
        --mamba-ssu-algorithm horizontal \
        --mamba-cache-mode align \
        --mamba-ssm-cache-dtype float16 \
        --enable-mamba-cache-stochastic-rounding \
        --mamba-cache-philox-rounds 5 \
        --reasoning-parser nemotron_v3 \
        --tool-call-parser qwen3_coder \
        --enable-auto-tool-choice
  notes: "Card section \"1x H100 (max throughput)\": no speculative decoding is best for max-throughput serving; Mamba cache dtype FP16 due to memory constraints. Card passes the model as --model $MODEL_CKPT (removed from args here). vLLM version: vllm/vllm-openai:v0.27.1."
